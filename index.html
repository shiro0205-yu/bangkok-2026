const CACHE_KEY="bkk_unlocked_html_v1";
const CACHE_EXP="bkk_unlocked_until_v1";
const CACHE_MS=10*60*1000;
function getCachedPage(){
  try{
    const until=Number(sessionStorage.getItem(CACHE_EXP)||0);
    const cached=sessionStorage.getItem(CACHE_KEY);
    if(cached && Date.now()<until) return cached;
    sessionStorage.removeItem(CACHE_KEY);
    sessionStorage.removeItem(CACHE_EXP);
  }catch(e){}
  return null;
}
function saveCachedPage(page){
  try{
    sessionStorage.setItem(CACHE_KEY,page);
    sessionStorage.setItem(CACHE_EXP,String(Date.now()+CACHE_MS));
  }catch(e){}
}

const b64bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const cachedPage=getCachedPage();
if(cachedPage){
  document.open();document.write(cachedPage);document.close();
}else{
async function unlock(){
 const pw=document.getElementById("pw").value;
 const err=document.getElementById("err");
 if(!pw){err.textContent="请输入密码";return}
 err.textContent="正在解锁…";
 try{
   const raw=new TextEncoder().encode(pw);
   const base=await crypto.subtle.importKey("raw",raw,"PBKDF2",false,["deriveKey"]);
   const key=await crypto.subtle.deriveKey(
     {name:"PBKDF2",salt:b64bytes(SALT),iterations:ITER,hash:"SHA-256"},
     base,{name:"AES-GCM",length:256},false,["decrypt"]
   );
   const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64bytes(IV)},key,b64bytes(DATA));
   const html=new TextDecoder().decode(out);
   document.open(); saveCachedPage(html);document.write(html); document.close();
 }catch(e){err.textContent="密码不正确，请再试一次。"}
}
document.getElementById("open").onclick=unlock;
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});

}
