<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e6">
<title>Bangkok Trip</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f1e6;color:#173b39}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
#gate{width:min(100%,430px);background:#fff;border-radius:28px;padding:34px 24px 28px;box-shadow:0 12px 40px rgba(26,55,52,.10);text-align:center}
.lock{font-size:56px;line-height:1;margin-bottom:18px}
h1{margin:0;font-size:34px;line-height:1.15}
.sub{margin:22px 0 26px;color:#7c8885;font-size:18px}
input{width:100%;height:62px;border:2px solid #dfe4df;border-radius:20px;padding:0 18px;font-size:18px;outline:none;background:white}
input:focus{border-color:#2b5e59}
button{width:100%;height:58px;margin-top:14px;border:0;border-radius:20px;background:#285d59;color:#fff;font-size:19px;font-weight:700}
.note{margin-top:22px;color:#99a19f;font-size:13px;line-height:1.55}
#error{min-height:22px;margin-top:10px;color:#b55b4b;font-size:14px}
</style>
</head>
<body>
<main id="gate">
  <div class="lock">🔐</div>
  <h1>Bangkok Trip</h1>
  <div class="sub">输入旅行密码后查看行程</div>
  <input id="pw" type="password" placeholder="Travel password" autocomplete="current-password">
  <button id="enter">进入行程 →</button>
  <div id="error"></div>
  <div class="note">行程内容已加密；解密只在当前浏览器中进行。<br>验证后 10 分钟内无需重复输入。</div>
</main>

const CACHE_VER="6e00d99f6ad325de";
const CACHE_HTML="bkk_unlocked_html_"+CACHE_VER;
const CACHE_UNTIL="bkk_unlocked_until_"+CACHE_VER;
const CACHE_MS=10*60*1000;

function bytes(s){
  const x=atob(s), a=new Uint8Array(x.length);
  for(let i=0;i<x.length;i++) a[i]=x.charCodeAt(i);
  return a;
}
function renderApp(html){
  try{
    sessionStorage.setItem(CACHE_HTML,html);
    sessionStorage.setItem(CACHE_UNTIL,String(Date.now()+CACHE_MS));
  }catch(e){}
  document.open("text/html","replace");
  document.write(html);
  document.close();
}
function tryCache(){
  try{
    const until=Number(sessionStorage.getItem(CACHE_UNTIL)||0);
    const html=sessionStorage.getItem(CACHE_HTML);
    if(html && Date.now()<until){ renderApp(html); return true; }
  }catch(e){}
  return false;
}
async function unlock(){
  const password=document.getElementById("pw").value;
  const err=document.getElementById("error");
  err.textContent="";
  if(!password){err.textContent="请输入密码";return;}
  try{
    const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),{name:"PBKDF2"},false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:bytes(SALT),iterations:ITER,hash:"SHA-256"},
      material,{name:"AES-GCM",length:256},false,["decrypt"]
    );
    const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(IV)},key,bytes(DATA));
    renderApp(new TextDecoder().decode(buf));
  }catch(e){err.textContent="密码不正确";}
}
document.getElementById("enter").addEventListener("click",unlock);
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
tryCache();
