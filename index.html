   const key=await crypto.subtle.deriveKey(
     {name:"PBKDF2",salt:b64bytes(SALT),iterations:ITER,hash:"SHA-256"},
     base,{name:"AES-GCM",length:256},false,["decrypt"]
   );
   const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64bytes(IV)},key,b64bytes(DATA));
   const html=new TextDecoder().decode(out);
   document.open(); document.write(html); document.close();
 }catch(e){err.textContent="密码不正确，请再试一次。"}
}
document.getElementById("open").onclick=unlock;
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
</script>
