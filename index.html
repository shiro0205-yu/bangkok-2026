const CACHE_HTML="bkk_unlocked_html_v2";
const CACHE_UNTIL="bkk_unlocked_until_v2";
const CACHE_MS=10*60*1000;

function bytes(b64){
  const s=atob(b64), a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i);
  return a;
}
function showPage(html){
  try{
    sessionStorage.setItem(CACHE_HTML,html);
    sessionStorage.setItem(CACHE_UNTIL,String(Date.now()+CACHE_MS));
  }catch(e){}
  document.open();
  document.write(html);
  document.close();
}
function tryCache(){
  try{
    const until=Number(sessionStorage.getItem(CACHE_UNTIL)||0);
    const html=sessionStorage.getItem(CACHE_HTML);
    if(html && Date.now()<until){
      showPage(html);
      return true;
    }
    sessionStorage.removeItem(CACHE_HTML);
    sessionStorage.removeItem(CACHE_UNTIL);
  }catch(e){}
  return false;
}
async function unlock(){
  const password=document.getElementById("pw").value;
  const err=document.getElementById("error");
  err.textContent="";
  if(!password){err.textContent="请输入密码";return;}
  try{
    const material=await crypto.subtle.importKey(
      "raw",new TextEncoder().encode(password),{name:"PBKDF2"},false,["deriveKey"]
    );
    const key=await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:bytes(SALT),iterations:ITER,hash:"SHA-256"},
      material,{name:"AES-GCM",length:256},false,["decrypt"]
    );
    const plainBuf=await crypto.subtle.decrypt(
      {name:"AES-GCM",iv:bytes(IV)},key,bytes(DATA)
    );
    showPage(new TextDecoder().decode(plainBuf));
  }catch(e){
    err.textContent="密码不正确";
  }
}
document.getElementById("enter").addEventListener("click",unlock);
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
tryCache();
